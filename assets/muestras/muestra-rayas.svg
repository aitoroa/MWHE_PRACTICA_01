<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <!-- Entre Hilos · muestra "rayas cantábrico" (exportada de .muestra-rayas en css/styles.css) -->
  <defs>
    <pattern id="rayas" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="14" height="30" fill="#777b55"/>
      <rect x="14" width="16" height="30" fill="#f4ede2"/>
    </pattern>
    <pattern id="trama" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000" fill-opacity="0.035"/>
      <rect width="1" height="3" fill="#fff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="url(#rayas)"/>
  <rect width="400" height="500" fill="url(#trama)"/>
</svg>
