<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <!-- Entre Hilos · muestra "retales al peso" (exportada de .muestra-retales en css/styles.css) -->
  <defs>
    <pattern id="retales" width="200" height="167" patternUnits="userSpaceOnUse">
      <rect width="100" height="83.5" fill="#f4ede2"/>
      <rect x="100" width="100" height="83.5" fill="#9f4b33"/>
      <rect x="100" y="83.5" width="100" height="83.5" fill="#777b55"/>
      <rect y="83.5" width="100" height="83.5" fill="#c98e94"/>
    </pattern>
    <pattern id="trama" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000" fill-opacity="0.035"/>
      <rect width="1" height="3" fill="#fff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="url(#retales)"/>
  <rect width="400" height="500" fill="url(#trama)"/>
</svg>
