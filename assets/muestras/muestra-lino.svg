<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <!-- Entre Hilos · muestra "lino arena" (exportada de .muestra-lino en css/styles.css) -->
  <defs>
    <pattern id="urdimbre" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="4" fill="#fff" fill-opacity="0.2"/>
    </pattern>
    <pattern id="trama-lino" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="1" fill="#292521" fill-opacity="0.08"/>
    </pattern>
    <pattern id="trama" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000" fill-opacity="0.035"/>
      <rect width="1" height="3" fill="#fff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="#d8c9ae"/>
  <rect width="400" height="500" fill="url(#urdimbre)"/>
  <rect width="400" height="500" fill="url(#trama-lino)"/>
  <rect width="400" height="500" fill="url(#trama)"/>
</svg>
