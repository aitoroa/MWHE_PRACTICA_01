<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <!-- Entre Hilos · muestra "espiga de la abuela" (exportada de .muestra-espiga en css/styles.css) -->
  <defs>
    <pattern id="espiga" width="20" height="20" patternUnits="userSpaceOnUse">
      <polygon points="0,0 20,0 10,10" fill="#8d9168"/>
      <polygon points="0,10 10,20 0,20" fill="#8d9168"/>
      <polygon points="20,10 20,20 10,20" fill="#8d9168"/>
    </pattern>
    <pattern id="trama" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000" fill-opacity="0.035"/>
      <rect width="1" height="3" fill="#fff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="#777b55"/>
  <rect width="400" height="500" fill="url(#espiga)"/>
  <rect width="400" height="500" fill="url(#trama)"/>
</svg>
