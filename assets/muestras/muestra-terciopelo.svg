<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <!-- Entre Hilos · muestra "cinta de terciopelo" (exportada de .muestra-terciopelo en css/styles.css) -->
  <defs>
    <radialGradient id="brillo" gradientUnits="userSpaceOnUse" cx="120" cy="75" r="480"
      gradientTransform="translate(120 75) scale(1 0.8333) translate(-120 -75)">
      <stop offset="0" stop-color="#c46a50"/>
      <stop offset="0.45" stop-color="#9f4b33"/>
      <stop offset="1" stop-color="#5c2819"/>
    </radialGradient>
    <pattern id="trama" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000" fill-opacity="0.035"/>
      <rect width="1" height="3" fill="#fff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="url(#brillo)"/>
  <rect width="400" height="500" fill="url(#trama)"/>
</svg>
