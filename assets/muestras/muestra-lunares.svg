<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <!-- Entre Hilos · muestra "lunares verbena" (exportada de .muestra-lunares en css/styles.css) -->
  <defs>
    <pattern id="lunares" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="17" r="5" fill="#c98e94"/>
      <circle cx="0" cy="0" r="5" fill="#c98e94"/>
      <circle cx="34" cy="0" r="5" fill="#c98e94"/>
      <circle cx="0" cy="34" r="5" fill="#c98e94"/>
      <circle cx="34" cy="34" r="5" fill="#c98e94"/>
    </pattern>
    <pattern id="trama" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000" fill-opacity="0.035"/>
      <rect width="1" height="3" fill="#fff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="#292521"/>
  <rect width="400" height="500" fill="url(#lunares)"/>
  <rect width="400" height="500" fill="url(#trama)"/>
</svg>
