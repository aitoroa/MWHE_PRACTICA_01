<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <!-- Entre Hilos · muestra "vichy merienda" (exportada de .muestra-vichy en css/styles.css) -->
  <defs>
    <pattern id="vichy" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="13" height="26" fill="#9f4b33" fill-opacity="0.55"/>
      <rect width="26" height="13" fill="#9f4b33" fill-opacity="0.55"/>
    </pattern>
    <pattern id="trama" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000" fill-opacity="0.035"/>
      <rect width="1" height="3" fill="#fff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="#f4ede2"/>
  <rect width="400" height="500" fill="url(#vichy)"/>
  <rect width="400" height="500" fill="url(#trama)"/>
</svg>
