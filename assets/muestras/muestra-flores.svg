<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <!-- Entre Hilos · muestra "florecitas del huerto" (exportada de .muestra-flores en css/styles.css) -->
  <defs>
    <pattern id="flores" width="44" height="44" patternUnits="userSpaceOnUse">
      <ellipse cx="0" cy="2" rx="4" ry="7" fill="#777b55"/>
      <ellipse cx="44" cy="2" rx="4" ry="7" fill="#777b55"/>
      <ellipse cx="0" cy="46" rx="4" ry="7" fill="#777b55"/>
      <ellipse cx="44" cy="46" rx="4" ry="7" fill="#777b55"/>
      <circle cx="22" cy="22" r="8" fill="#c98e94"/>
      <circle cx="22" cy="22" r="3" fill="#9f4b33"/>
    </pattern>
    <pattern id="trama" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000" fill-opacity="0.035"/>
      <rect width="1" height="3" fill="#fff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="#f4ede2"/>
  <rect width="400" height="500" fill="url(#flores)"/>
  <rect width="400" height="500" fill="url(#trama)"/>
</svg>
