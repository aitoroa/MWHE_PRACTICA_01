<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ENTRE HILOS</title>

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style type="text/tailwindcss">
      @theme static {
        --color-primary: "#F2E9E4";
        --color-secondary: "#D9CFC1";
        --color-accent: "#A7A5A5";
        --color-neutral: "#3B3B3B";
        --font-sans: "EB Garamond", "Work Sans", sans-serif;
        --font-serif: "Fraunces", Georgia, serif;
      }
    </style>

    <!-- Tailwind desde el CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body
    class="bg-crema font-texto text-tinta antialiased transition-colors duration-500 dark:bg-noche dark:text-crema"
  >
    <a href="#contenido" class="saltar-contenido">Saltar al contenido</a>
    <header
      id="cabecera"
      class="cabecera cabecera-oculta fixed inset-x-0 top-0 z-50"
    >
      <div class="mx-auto flex max-w-7xl items-center gap-3 px-5 py-4 md:px-8">
        <a
          href="#portada"
          class="logo mr-auto font-titulo text-2xl leading-none font-extrabold tracking-tight lowercase md:text-3xl"
          aria-label="Entre Hilos, volver al inicio"
          >entre hilos<span class="punto" aria-hidden="true"></span
        ></a>

        <nav aria-label="Principal">
          <ul
            id="menu"
            class="menu-desplegable absolute inset-x-0 top-full hidden border-b border-tinta/15 bg-crema/88 px-5 pt-4 pb-8 backdrop-blur-md dark:border-crema/15 dark:bg-noche/88 lg:static lg:flex lg:items-center lg:gap-8 lg:border-0 lg:bg-transparent lg:p-0 lg:backdrop-blur-none lg:dark:bg-transparent"
          >
            <li>
              <a
                href="#telas"
                class="enlace-menu block py-2 font-titulo text-4xl font-bold lowercase lg:py-1 lg:font-texto lg:text-xs lg:font-medium lg:tracking-[0.25em] lg:uppercase"
                >Telas</a
              >
            </li>
            <li>
              <a
                href="#crea-tu-kit"
                class="enlace-menu block py-2 font-titulo text-4xl font-bold lowercase lg:py-1 lg:font-texto lg:text-xs lg:font-medium lg:tracking-[0.25em] lg:uppercase"
                >Crea tu kit</a
              >
            </li>
            <li>
              <a
                href="#talleres"
                class="enlace-menu block py-2 font-titulo text-4xl font-bold lowercase lg:py-1 lg:font-texto lg:text-xs lg:font-medium lg:tracking-[0.25em] lg:uppercase"
                >Talleres</a
              >
            </li>
            <li>
              <a
                href="#novedades"
                class="enlace-menu block py-2 font-titulo text-4xl font-bold lowercase lg:py-1 lg:font-texto lg:text-xs lg:font-medium lg:tracking-[0.25em] lg:uppercase"
                >Novedades</a
              >
            </li>
            <li>
              <a
                href="#tienda"
                class="enlace-menu block py-2 font-titulo text-4xl font-bold lowercase lg:py-1 lg:font-texto lg:text-xs lg:font-medium lg:tracking-[0.25em] lg:uppercase"
                >La tienda</a
              >
            </li>
          </ul>
        </nav>
        <button
          id="boton-tema"
          type="button"
          aria-pressed="false"
          aria-label="Activar modo oscuro"
          class="boton-icono grid size-11 place-items-center rounded-full border border-tinta/20 transition hover:border-terracota hover:text-terracota focus-visible:border-terracota dark:border-crema/25 lg:ml-4"
        >
          <svg
            class="size-5 transition-transform duration-500 dark:rotate-180"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle
              cx="12"
              cy="12"
              r="9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor" />
          </svg>
        </button>
        <button
          id="boton-menu"
          type="button"
          aria-expanded="false"
          aria-controls="menu"
          class="boton-menu grid size-11 place-items-center rounded-full bg-tinta text-crema transition hover:bg-terracota focus-visible:bg-terracota dark:bg-crema dark:text-tinta lg:hidden"
        >
          <span class="hamburguesa" aria-hidden="true"
            ><span></span><span></span><span></span
          ></span>
          <span id="texto-boton-menu" class="sr-only">Abrir menú</span>
        </button>
      </div>
    </header>
    <main id="contenido">
      <section
        id="inicio"
        class="relative h-svh overflow-hidden bg-tinta text-crema dark:bg-noche"
        aria-label="Vídeo de presentación"
      >
        <video
          class="absolute inset-0 size-full object-cover"
          src="assets/video-portada.mp4"
          autoplay
          muted
          loop
          playsinline
          aria-hidden="true"
        ></video>
      </section>
    </main>
    <footer></footer>

    <!-- JavaScript -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="/js/script.js"></script>
  </body>
</html>
